# The contact frontier: the earliest documented direct European presence, by area.
#
# HOW THIS FILE RESOLVES. Every entry is a year and an area. A place takes the *earliest* year of
# every entry covering it, so the order of entries does not matter and the file can be edited by
# hand for years without anyone having to hold it all in their head.
#
# THE CONSEQUENCE, which is the thing to get right: a `drainage` entry covers a whole basin, so it
# must carry that basin's *latest*, deep-interior date. Earlier dates for its coast, its river and
# its posts are layered on as smaller shapes and cut through by the earliest-wins rule. Put 1611 on
# the whole of northern Ontario because Hudson saw James Bay and the interior is dated a century
# early with no way to correct it.
#
# The 25 StatCan drainage regions partition modern Canada with no gaps (atlas.primitives.partition),
# so the 25 basin entries make "every hex has a year" a property of the data, not a hope.
#
# COORDINATES. Island seeds only have to fall inside the right island, and buffer centres are used
# with radii of 40–200 km, so map-read coordinates of ±0.05° are harmless here in a way they would
# not be on a boundary. Coordinates marked (defacto) are the verified ones from defacto.yaml.
#
# WHAT IS DELIBERATELY NOT HERE. Reconstructed journey corridors — Hearne 1770–72, Henday 1754–55,
# de Troyes 1686, Albanel 1672 — would change the interior's shape a great deal, and their routes
# are argued over: Hearne's own longitudes were badly out. Drawing them from prose would be tracing
# a guess. They wait for a published route map (Historical Atlas of Canada, vol. I, has plates for
# exactly these; Open Government's "Exploration 1651–1760" may be that plate as vectors). Until
# then the interior takes its basin's later, documented date. See docs/decisions.md.

caveat: |
  "First contact" is a European frame. These years record when Europeans arrived and wrote it
  down; the peoples already living here had their own long histories of these encounters, and of
  the places and routes Europeans then claimed to have discovered. Contact also usually arrived
  before Europeans did: trade goods, horses and above all epidemic disease moved along Indigenous
  networks decades ahead of any European traveller — the smallpox epidemic of 1780–82 reached the
  northern Plains through Indigenous trade and warfare routes and killed a large share of the
  population in country no European had yet visited. The dates are uneven in kind as well: some
  mark a ship passing offshore, others a wintering or a permanent post, and in the far north and
  the deep interior they are the best documented guess rather than a record of what happened first.

# Display bands for the choropleth. A band covers [from, until).
bands:
  - {from: null, until: 1500, label: Before 1500}
  - {from: 1500, until: 1600, label: 1500–1599}
  - {from: 1600, until: 1700, label: 1600–1699}
  - {from: 1700, until: 1800, label: 1700–1799}
  - {from: 1800, until: 1900, label: 1800–1899}
  - {from: 1900, until: null, label: 1900 and after}

