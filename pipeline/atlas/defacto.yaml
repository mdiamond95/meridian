# De facto European presence, 1670–1870: the dated places the de facto truth layer is built from.
#
# A post is a presence marker inside Indigenous-held territory, not a territory: its catchment is a
# circle of the tier's radius around the listed site, drawn while one of its periods is open. A
# settlement belt is permanent farming or fishing settlement along a shore or river: a corridor of
# `km` around its line or points. Snapshots are taken at event years (events.yaml `posts:` and
# `belts:` expressions), so a post that opened and closed between two events never shows.
#
# Periods are [from, to, power] in years, `to` exclusive (null = still open in 1870). A post that
# changed hands (the French raids on the bay posts, 1686–1714) has one period per holder, and an
# abandoned post has a gap.
#
# Sources: each post's URL (CGNDB or Wikipedia coordinates, both citing HBCA, DCB or Parks Canada);
# radii from nearest-neighbour spacing of 42 long-lived posts (median ~200 km, so an exclusive
# reach of 60–120 km) and the York Factory wood-cutting corridor (Manitoba History 20,
# mhs.mb.ca/docs/mb_history/20/fortchurchill.shtml). Settlement belt depths are the usual figures
# (a St. Lawrence rang of 40 arpents ≈ 2.3 km; Red River lots of 2 miles plus hay privilege) and
# carry lower confidence than the posts' sites: see docs/decisions.md.

tiers:  # catchment radius in km
  bay_factory: 60        # Hudson Bay and James Bay factories
  depot: 80              # inland depots and district headquarters
  post: 50               # permanent posts
  outpost: 25            # short-lived, seasonal or duplicate posts
  french_west: 40        # La Vérendrye's posts, 1731–1759
  french_lakes: 50       # French Great Lakes forts
  pacific: 30            # Pacific coast forts before the colonies

