# Indigenous language families: the lookup behind the `indigenous_language_family` attrs column
# and the pre-contact base's family layer (pipeline/indigenous.py).
#
# What a family is here: a top-level family (or isolate) in Glottolog 5.3 (source
# `glottolog_languoids`, CC BY 4.0). Using Glottolog's families for the census languages is what
# lets the two sources fill one column: a cell coloured from census speakers and a cell filled
# from the nearest Glottolog point mean the same thing by "Salishan".
#
# How each census language is mapped (the `source` of every row): the census language is matched
# to one Glottolog languoid (`glottocode`), and its family is that languoid's top-level family in
# Glottolog 5.3. Where the census name differs from Glottolog's, the row says which languoid was
# taken and why. "n.o.s." (not otherwise specified) and "n.i.e." (not included elsewhere) rows map
# to the Glottolog group that matches their census parent. pytest checks every glottocode's family
# against the downloaded languoid table.
#
# Census characteristics are from the 2021 Census Profile (98-401-X2021), "Mother tongue for the
# total population excluding institutional residents", single responses, the subtree under
# characteristic 385 "Indigenous languages". Every id from 386 to 475 appears exactly once below:
# as a language (fetched and mapped), as a group (a census subtotal of the languages under it, not
# fetched, so no speaker is counted twice), or as a residual (no family can be named).

# Shown with the family layer. The app renders the literal from its schema
# (app/src/schema/indigenous.ts); the build copies this text into indigenous.v1.json and pytest
# checks that the two agree.
caveat: Derived from modern language distribution and linguistic records; not pre-contact boundaries.

# `code` is the value in the attrs column (0 = unassigned) and never changes meaning. `label` is
# what the map shows. Glottolog's name for the Inuit, Yupik and Unangan family is "Eskimo-Aleut",
# a word many Inuit reject, so the map uses "Inuit" and keeps Glottolog's name in `glottolog_name`.
families:
  - { code: 1, glottocode: algi1248, glottolog_name: Algic, label: Algonquian }
  - { code: 2, glottocode: atha1245, glottolog_name: Athabaskan-Eyak-Tlingit, label: Dene (Athabaskan) and Tlingit }
  - { code: 3, glottocode: eski1264, glottolog_name: Eskimo-Aleut, label: Inuit }
  - { code: 4, glottocode: haid1248, glottolog_name: Haida, label: Haida }
  - { code: 5, glottocode: iroq1247, glottolog_name: Iroquoian, label: Iroquoian }
  - { code: 6, glottocode: kute1249, glottolog_name: Kutenai, label: Ktunaxa }
  - { code: 7, glottocode: sali1255, glottolog_name: Salishan, label: Salish }
  - { code: 8, glottocode: siou1252, glottolog_name: Siouan, label: Siouan }
  - { code: 9, glottocode: tsim1258, glottolog_name: Tsimshian, label: Tsimshianic }
  - { code: 10, glottocode: waka1280, glottolog_name: Wakashan, label: Wakashan }
  # No census speakers (Beothuk has had none since 1829); it enters only through the Glottolog fill.
  - { code: 11, glottocode: beot1247, glottolog_name: Beothuk, label: Beothuk }

# Glottolog "families" that are not Indigenous language families of Canada, and so never fill a
# cell: pidgins and trade jargons (Chinook Jargon's creole is filed under Chinookan, at a
# placeholder point in the middle of British Columbia), sign languages, Indo-European languages
# spoken in Canada, bookkeeping entries and artificial languages. Listed so the build can fail on a
# family it has never seen rather than drop it quietly.
glottolog_excluded_families:
  - { glottocode: pidg1258, glottolog_name: Pidgin }
  - { glottocode: sign1238, glottolog_name: Sign Language }
  - { glottocode: indo1319, glottolog_name: Indo-European }
  - { glottocode: book1242, glottolog_name: Bookkeeping }
  - { glottocode: arti1236, glottolog_name: Artificial Language }
  - { glottocode: chin1490, glottolog_name: Chinookan }

