events:
  - date: 1670-05-12
    title: The Hudson's Bay Company charter
    note: >-
      Charles II grants the Hudson's Bay Company the lands draining into Hudson Bay, as Rupert's Land.
      France holds Canada and Acadia, and England and France both fish and claim Newfoundland. The charter
      is dated 2 May 1670 in the Old Style calendar England then used.
    changes:
      - create: ruperts_land
        name: Rupert's Land
        status: hbc_charter
        sovereign: Hudson's Bay Company
        note: Granted to the Hudson's Bay Company by royal charter; France contested the bay posts until 1713.
        instrument: >-
          Royal Charter of the Hudson's Bay Company, 2 May 1670 (Old Style): "all the Landes Countryes and
          Territoryes upon the Coastes and Confynes of the Seas ... that lye within the entrance of the Streightes
          commonly called Hudsons Streightes".
        boundary: >-
          The lands draining to Hudson Bay and Hudson Strait (StatCan ocean drainage area Hudson Bay), including
          the bay's islands and southern Baffin Island. The charter names no watershed; the drainage basin is the
          standard reading (Historical Atlas of Canada). NRCan's 1667 and 1713 plates stripe a disputed band along
          its southern margin; that band is not drawn.
        geometry:
          shape: hudson_bay

      - create: acadia
        name: Acadia
        status: colony
        sovereign: France
        capital: Port-Royal
        note: Restored to France by the Treaty of Breda (1667) and handed over in 1670; its seat moved several times.
        instrument: Treaty of Breda, 31 July 1667, art. X (restitution of Acadia to France).
        boundary: >-
          Modern Nova Scotia, New Brunswick and Prince Edward Island, with Cape Breton. Its limit against Canada was
          never defined.
        geometry:
          modern: [NS, NB, PE]

      - create: newfoundland
        name: Newfoundland
        status: disputed
        sovereign: England and France
        note: >-
          English fishing settlements on the east coast and the French colony of Plaisance, founded 1662. NRCan's
          1667 plate stripes the whole island.
        instrument: >-
          No instrument settled it: England's claim rested on Cabot (1497) and Gilbert (1583), France's on its
          colony at Plaisance (1662).
        boundary: The island of Newfoundland and its islands.
        geometry:
          shape: newfoundland_island

      - create: north_western_territory
        name: Lands outside European claims
        status: unorganized
        sovereign: Indigenous nations
        nrcan: Northwest Territories
        note: The Pacific slope, the Arctic and Missouri drainage, and the Arctic islands, held by Indigenous nations.
        boundary: The Pacific, Arctic and Missouri drainage regions (StatCan 01–09), with the Arctic islands.
        geometry:
          shape: west_and_north

      - create: new_france
        name: Canada (New France)
        status: colony
        sovereign: France
        capital: Québec
        note: The colony of Canada, claiming the St. Lawrence and Great Lakes basins (the pays d'en haut) and Labrador's Atlantic slope.
        instrument: >-
          French royal government of New France from 1663 (Édit de création du Conseil souverain, April 1663);
          no instrument fixed its limits.
        boundary: >-
          The rest of modern Canada: the Great Lakes, Ottawa, St. Lawrence and North Shore basins, the Gaspé, and the
          Atlantic slope of Labrador, as NRCan's 1667 plate draws New France.
        geometry:
          minus:
            - canada: true
            - unit: ruperts_land
            - unit: acadia
            - unit: newfoundland
            - unit: north_western_territory

      - create: defacto_french_settlement
        name: French settlement
        status: colony
        sovereign: France
        truth: defacto
        confidence: 0.8
        boundary: >-
          Settlement belts open in 1670 (pipeline/atlas/defacto.yaml): the St. Lawrence seigneurial belt, the
          Richelieu, Port-Royal, and Plaisance.
        geometry: {belts: {as_of: 1670, power: french}}
      - create: defacto_french_posts
        name: French trading posts
        status: colony
        sovereign: France
        truth: defacto
        confidence: 0.3
        boundary: Catchments of French posts open in 1670 (Tadoussac, Mingan).
        geometry: {posts: {as_of: 1670, power: french}}
      - create: defacto_english_settlement
        name: English settlement
        status: colony
        sovereign: England
        truth: defacto
        confidence: 0.7
        boundary: The English Shore of Newfoundland, Trepassey to Bonavista.
        geometry: {belts: {as_of: 1670, power: british}}
      - create: defacto_english_posts
        name: Hudson's Bay Company posts
        status: hbc_charter
        sovereign: Hudson's Bay Company
        truth: defacto
        confidence: 0.35
        boundary: Catchments of posts open in 1670 (Charles Fort on James Bay).
        geometry: {posts: {as_of: 1670, power: british}}

  - date: 1713-04-11
    title: The Treaty of Utrecht
    note: >-
      France gives up Hudson Bay, Newfoundland and "Nova Scotia or Acadia, with its ancient boundaries" to Great
      Britain, and keeps Cape Breton and the islands of the Gulf as Île Royale. The two powers never agree what
      Acadia's ancient boundaries were. Signed 31 March 1713 in the Old Style calendar; the exchange of
      ratifications was within four weeks but its day is not established.
    date_confidence: 0.8
    changes:
      - create: nova_scotia
        name: Nova Scotia
        status: colony
        sovereign: Britain
