  - date: 1999-04-01
    title: Nunavut
    note: >-
      Nunavut is created from the eastern and northern Northwest Territories, following the
      Nunavut Land Claims Agreement. The old districts of Mackenzie, Keewatin and Franklin end.
    changes:
      - create: nunavut
        name: Nunavut
        status: territory
        sovereign: Canada
        capital: Iqaluit
        boundary: >-
          Nunavut Act, 1993: north of 60°N and east of the Schedule I line, with all the islands of
          Hudson, James and Ungava Bays not in a province. The modern border.
        geometry: {modern: [NU]}
      - create: northwest_territories
        name: Northwest Territories
        status: territory
        sovereign: Canada
        capital: Yellowknife
        boundary: The rest of the territories west of the Schedule I line. The modern border.
        geometry: {modern: [NT]}
      - dissolve: district_of_mackenzie
      - dissolve: district_of_keewatin
      - dissolve: district_of_franklin

  - date: 2001-12-06
    title: Newfoundland and Labrador
    note: >-
      A constitutional amendment renames the province Newfoundland and Labrador. Its boundaries are
      unchanged.
    changes:
      - rename: newfoundland
        name: Newfoundland and Labrador

  - date: 2003-04-01
    title: Yukon
    note: >-
      The new Yukon Act drops "Territory" from the name. Its boundaries are unchanged.
    changes:
      - rename: yukon
        name: Yukon

  - date: 2022-06-14
    title: Hans Island divided
    note: >-
      Canada and the Kingdom of Denmark agree a land boundary across Hans Island, following a gully from north
      to south: the western part is Canadian and becomes part of Nunavut, the eastern part is Greenlandic. It is
      Canada's first new land boundary since 1949, and the last of the disputes in this atlas to close.
    changes:
      - dissolve: hans_claim_canada
      - dissolve: hans_claim_denmark
      - alter: nunavut
        confidence: 0.6
        instrument: >-
          Agreement between Canada and the Kingdom of Denmark together with Greenland, 14 June 2022, art. 4(3):
          the land boundary follows the points listed in Annex 3, leaving the eastern part to Greenland.
        note: >-
          The 1:1M source draws the whole island in Canada, so the Greenlandic part is cut from Nunavut for the
          map to agree with the treaty. That part is about 0.57 km², below the 2 km² minimum the display copy
          keeps, so the drawn polygon does not change: the change is in the row, not the picture. The island's
          outline at 1:1M is generalized, so the treaty's roughly even division comes out closer to a
          third–two thirds. The boundary is drawn, not surveyed.
        boundary: Less the eastern part of Hans Island, which is Greenland's under the 2022 agreement.
        geometry:
          minus:
            - unit: nunavut
            - cut:
                of: {island: [-66.4491, 80.8258]}
                line: [[-66.4091, 80.8082], [-66.450667, 80.821444], [-66.464528, 80.825861],
                       [-66.456667, 80.831833], [-66.4331, 80.8497]]
                keep: [-66.4491, 80.8258]
