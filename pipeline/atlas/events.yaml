          (95°09'W) to the English River; up the English River (Canada1Water) to Lac Seul, through
          Lac Seul and across to Lake St. Joseph (NRCan waypoints), and down the Albany River
          (Canada1Water) to James Bay; the Ontario–Quebec line is unchanged. The disputed area south
          of the English River becomes Ontario; NRCan gives the part north of it to Keewatin, and so
          does this atlas.
