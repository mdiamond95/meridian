# The historical atlas: every first-order boundary change from Confederation to today.
#
#   make atlas           build data/build/atlas.v1.json, atlas.v1.topojson.gz, docs/atlas/checklist.md
#   python -m atlas.build --check    validate and compare with NRCan without writing
#
# Geometry expressions and ring pieces are documented in atlas/build.py. Coordinates are
# [longitude, latitude] in degrees. Every geometry is clipped to modern Canada.
#
# Drawing rules (docs/decisions.md, 2026-09-15 Phase 2 Sitting A):
#   - The instrument's text decides where it is clear. NRCan's Territorial Evolution maps decide
#     where the text is silent, ambiguous or disputed. Each divergence from NRCan is named in the
#     unit's `boundary` text, which the checklist prints.
#   - A line only needs to be exact where two units meet. Lines through water, or through land
#     that another unit already holds, are rough on purpose: the clip and the set operations
#     remove what they cross.
#   - Lake shores, and survey lines no source here carries, use waypoints taken from NRCan's
#     line and simplified to about 2 km; they are marked "(NRCan waypoints)".
#   - Dominion Land Survey lines: correction and base line latitudes are read from the jogs in
#     the modern Manitoba–Saskatchewan border (Atlas of Canada 1:1M). 9th correction line
#     51.9686°N, 12th base line 52.8422°N, 18th correction line 55.1116°N, 32nd ≈ 60°N.

shapes:
  hudson_bay:
    watershed: hudson_bay

  # Waters dividing the Arctic Archipelago from the mainland, as the 1895 order walks them:
  # Hudson Strait, Foxe Channel, Fury and Hecla Strait, Gulf of Boothia, Bellot and Franklin
  # Straits, James Ross, Rae and Simpson Straits, Queen Maud Gulf, Dease Strait, Coronation Gulf,
  # Dolphin and Union Strait, Amundsen Gulf to 71°N 125°30'W, then west of Banks and Prince Patrick.
  archipelago_waters:
    ring:
      - line: [[-63.5, 60.9], [-66.5, 61.0], [-70.0, 61.9], [-73.0, 62.4], [-76.0, 62.75], [-77.5, 63.0],
               [-79.0, 64.8], [-80.0, 67.0], [-82.0, 69.0], [-84.0, 69.9], [-86.0, 69.95], [-88.0, 70.3],
               [-91.5, 71.7], [-94.5, 72.02], [-96.1, 71.6], [-95.9, 70.0], [-95.5, 68.9], [-97.5, 68.5],
               [-101.5, 68.4], [-106.5, 68.75], [-110.0, 68.6], [-115.0, 69.1], [-120.0, 70.0],
               [-125.5, 71.0], [-128.0, 72.0], [-127.0, 77.0], [-120.0, 79.5]]
      - line: [[-120.0, 79.5], [-100.0, 84.5], [-60.0, 84.5], [-55.0, 80.0], [-55.0, 70.0], [-58.0, 64.0],
               [-63.5, 60.9]]

  arctic_islands:
    minus: [{zone: {shape: archipelago_waters}}, {mainland: true}]

  # Newfoundland's Labrador before 1927: "the coast of Labrador", with no inland limit in law.
  # NRCan draws a coastal strip 40–100 km wide around Lake Melville; its inner edge (NRCan
  # waypoints, 1867–1926 maps) runs from Blanc-Sablon to Cape Chidley, closed offshore.
  labrador_coast_strip:
    ring:
      - line: [[-57.15, 51.42], [-57.14, 51.93], [-56.63, 52.22], [-56.70, 53.02], [-56.90, 53.16],
               [-58.35, 53.59], [-59.02, 53.52], [-60.31, 53.05], [-61.05, 53.22], [-61.12, 53.64],
               [-60.90, 53.86], [-59.60, 54.11], [-59.05, 54.35], [-60.69, 54.72], [-62.32, 55.93],
               [-64.16, 58.38], [-64.55, 59.02], [-64.53, 59.34], [-64.92, 59.64], [-64.68, 59.94],
               [-64.60, 60.60]]
      - line: [[-64.60, 60.60], [-64.0, 61.0], [-60.0, 59.0], [-57.0, 56.0], [-54.5, 54.0], [-54.8, 52.2],
               [-56.5, 51.55], [-57.3, 51.2], [-57.15, 51.42]]

  newfoundland_before_1927:
    union:
      - minus: [{modern: [NL]}, {mainland: true}]
      - intersect: [{modern: [NL]}, {shape: labrador_coast_strip}]

  # The northern districts' land, as it stood when an event began: redistributions draw from it.
  northern_pool:
    was: [district_of_keewatin, district_of_franklin, district_of_mackenzie, district_of_ungava, northwest_territories]

  # 1897 redrew the District of Yukon along with the others.
  northern_pool_with_yukon:
    union: [{shape: northern_pool}, {was: yukon}]

  # The 1895 District of Yukon, which the Yukon Territory Act adopted in 1898: 141°W, 60°N to the
  # Liard, the ranges west of the Liard and the Peel, 136°W north to the Arctic (NRCan waypoints).
  yukon_1895:
    ring:
      - line: [[-141.5, 58.0], [-141.5, 72.0], [-136.103, 72.0], [-136.103, 68.873], [-136.114, 67.566],
               [-136.161, 67.427], [-136.053, 67.282], [-136.172, 67.139], [-135.898, 66.542], [-135.482, 66.100],
               [-134.640, 65.829], [-134.157, 65.435], [-133.686, 65.315], [-132.495, 64.607], [-131.813, 64.366],
               [-131.238, 64.452], [-130.865, 64.186]]
      - shape: yukon_ranges_south
      - line: [[-123.785, 60.001], [-123.785, 58.0], [-141.5, 58.0]]

  # Common to the 1895 and 1897 Yukon lines: the ranges from 64.2°N down to the Liard at 60°N.
  yukon_ranges_south:
    line: [[-130.865, 64.186], [-130.932, 64.141], [-130.892, 64.080], [-130.716, 63.959], [-130.272, 63.818],
           [-130.239, 63.877], [-130.116, 63.870], [-130.088, 63.772], [-130.303, 63.706], [-130.283, 63.662],
           [-130.168, 63.690], [-129.862, 63.518], [-129.883, 63.395], [-130.136, 63.309], [-130.134, 63.257],
           [-129.615, 63.051], [-129.742, 62.839], [-129.454, 62.634], [-129.508, 62.590], [-129.465, 62.550],
           [-129.142, 62.481], [-129.219, 62.457], [-129.271, 62.309], [-129.145, 62.100], [-128.904, 62.119],
           [-128.783, 62.056], [-128.502, 62.123], [-127.516, 61.532], [-127.285, 61.518], [-127.105, 61.341],
           [-127.037, 61.149], [-127.113, 61.081], [-126.969, 60.999], [-126.805, 60.750], [-126.510, 60.797],
           [-126.304, 60.761], [-126.200, 60.853], [-126.020, 60.802], [-125.866, 60.886], [-125.368, 60.778],
           [-124.558, 60.989], [-124.452, 60.846], [-124.570, 60.705], [-124.208, 60.407], [-124.086, 60.227],
           [-123.685, 60.152], [-123.785, 60.001]]

  # The peninsulas the 1897 and 1918 orders cut off at their isthmuses: Boothia Isthmus from Spence
  # Bay to Lord Mayor Bay, Rae Isthmus from Committee Bay to Repulse Bay (NRCan waypoints).
  boothia_peninsula:
    cut: {of: {mainland: true}, line: [[-93.64, 69.52], [-92.73, 69.72]], keep: [-94.5, 70.5]}
  melville_peninsula:
    cut:
      of: {mainland: true}
      line: [[-87.35, 67.30], [-87.32, 67.15], [-86.80, 66.57], [-86.66, 66.53], [-86.60, 66.45]]
      keep: [-84.0, 68.0]

  # Ranges 10/11 west of the 4th Meridian (centre of the road allowance), stepped at each
  # correction line: 10 ranges of 9.80 km measured on each block's base line west of 110°W.
  range_10_11_w4_to_55n:
    line: [[-111.3419, 49.0], [-111.3419, 49.1777], [-111.3516, 49.1777], [-111.3516, 49.5327],
           [-111.3614, 49.5327], [-111.3614, 49.8867], [-111.3715, 49.8867], [-111.3715, 50.2405],
           [-111.3817, 50.2405], [-111.3817, 50.5944], [-111.3921, 50.5944], [-111.3921, 50.9485],
           [-111.4027, 50.9485], [-111.4027, 51.3019], [-111.4136, 51.3019], [-111.4136, 51.6549],
           [-111.4234, 51.6549], [-111.4234, 51.9686], [-111.4345, 51.9686], [-111.4345, 52.3182],
           [-111.4459, 52.3182], [-111.4459, 52.6673], [-111.4575, 52.6673], [-111.4575, 53.0164],
           [-111.4693, 53.0164], [-111.4693, 53.3658], [-111.4814, 53.3658], [-111.4814, 53.7151],
           [-111.4938, 53.7151], [-111.4938, 54.0644], [-111.5064, 54.0644], [-111.5064, 54.4136],
           [-111.5193, 54.4136], [-111.5193, 54.7626], [-111.5324, 54.7626], [-111.5324, 55.1116]]

events:
  - date: 1867-07-01
    title: Confederation
    note: >-
      Ontario, Quebec, Nova Scotia and New Brunswick unite as the Dominion of Canada. Everything
      north and west still belongs to Britain or to the Hudson's Bay Company.
    changes:
      - create: ontario
        name: Ontario
        status: province
        sovereign: Canada
        capital: Toronto
        boundary: >-
          The former Canada West: the Great Lakes–St. Lawrence side of the height of land (the
          Hudson Bay watershed), meeting the international boundary west of Lake Superior. Its
          northern and western limits were unsettled in law; the height of land is the Dominion's
          reading and NRCan's.
        geometry:
          minus: [{modern: [ON]}, {shape: hudson_bay}]

      - create: newfoundland
        name: Newfoundland
        status: colony
        sovereign: Britain
        capital: St. John's
        confidence: 0.5
        note: >-
          A self-governing British colony, a Dominion from 1907, and under a Commission of
          Government from 1934. How far its Labrador coast ran inland was not defined until 1927;
          the strip shown follows NRCan's maps.
        boundary: >-
          The island, and the coast of Labrador from Blanc-Sablon to Cape Chidley as NRCan's coastal
          strip (NRCan waypoints). Not a legal line: the inland limit was undefined before 1927.
        geometry:
          shape: newfoundland_before_1927

      - create: quebec
        name: Quebec
        status: province
        sovereign: Canada
        capital: Québec
        boundary: >-
          The former Canada East: the St. Lawrence side of the height of land, north-east to the
          Blanc-Sablon meridian at 52°N. Taken as modern Quebec and Labrador less the Hudson Bay
          watershed, the Atlantic drainage of Labrador (StatCan drainage region 25) and
          Newfoundland's coast.
        geometry:
          minus:
            - modern: [QC, NL]
            - shape: hudson_bay
            - drainage: ["25"]
            - unit: newfoundland

      - create: nova_scotia
        name: Nova Scotia
        status: province
        sovereign: Canada
        capital: Halifax
        boundary: Modern Nova Scotia.
        geometry: {modern: [NS]}

      - create: new_brunswick
        name: New Brunswick
        status: province
        sovereign: Canada
        capital: Fredericton
        boundary: Modern New Brunswick.
        geometry: {modern: [NB]}

      - create: prince_edward_island
        name: Prince Edward Island
        status: colony
        sovereign: Britain
        capital: Charlottetown
        boundary: Modern Prince Edward Island.
        geometry: {modern: [PE]}

      - create: british_columbia
        name: British Columbia
        status: colony
        sovereign: Britain
        capital: Victoria
        note: >-
          Vancouver Island and the mainland colony were united in 1866; the capital moved from New
          Westminster to Victoria in 1868.
        boundary: >-
          Modern British Columbia: 49°N, the Rocky Mountain divide, 120°W and 60°N. The Alaska
          panhandle line is the 1903 award, as NRCan draws it for every year; the dispute is a
          Sitting C overlay.
        geometry: {modern: [BC]}

      - create: ruperts_land
        name: Rupert's Land
        status: hbc_charter
        sovereign: Hudson's Bay Company
        note: Granted to the Hudson's Bay Company by royal charter in 1670.
        boundary: >-
          The lands draining to Hudson Bay and Hudson Strait (StatCan ocean drainage area Hudson
          Bay), including the bay's islands and southern Baffin Island. Also the Labrador interior
          inland of Newfoundland's coast, which drains to the Atlantic: NRCan draws it here, and no
          instrument assigns it elsewhere.
        geometry:
          minus:
            - union: [{shape: hudson_bay}, {intersect: [{drainage: ["25"]}, {mainland: true}]}]
            - unit: ontario
            - unit: quebec
            - unit: newfoundland
            - unit: british_columbia

      - create: arctic_islands
        name: British Arctic Islands
        status: unorganized
        sovereign: Britain
        nrcan: Arctic Islands
        confidence: 0.7
        instrument: >-
          Rupert's Land and North-Western Territory Order (Imperial Order in Council, 23 June 1870,
          in force 15 July 1870), operative paragraph, which names no boundaries; Adjacent Territories
          Order (Imperial Order in Council, 31 July 1880), operative paragraph, transferring "all Islands
          adjacent" from 1 September 1880.
        rationale: >-
          London and Ottawa treated the Arctic islands as outside the 1870 transfer, which is why Britain
          transferred them separately in 1880, so they are drawn apart from the North-Western Territory;
          the DCER editors note the 1821 and 1859 definitions could be read to include them, hence 0.7.
        nrcan_overlay:
          year: 1867
          until: 1870-07-15
          polygons:
            - name: Northwest Territories
              note: NRCan's 1867 map draws the Arctic islands inside the North-Western Territory.
        boundary: >-
          The Arctic Archipelago north of the straits the 1895 order names, less the parts draining
          to Hudson Bay. NRCan's 1867 map folds these islands into the North-Western Territory;
          they were not part of it, and NRCan separates them from 1870.
        geometry:
          minus: [{shape: arctic_islands}, {shape: hudson_bay}]

      - create: north_western_territory
        name: North-Western Territory
        status: unorganized
        sovereign: Britain
        note: Never defined in law; British territory under the Hudson's Bay Company's trade.
        nrcan: Northwest Territories
        boundary: >-
          The rest of British North America: the Arctic and Pacific drainage north of British
          Columbia and west of Rupert's Land, with the mainland's coastal islands.
        geometry:
          minus:
            - canada: true
            - unit: ontario
            - unit: quebec
            - unit: nova_scotia
            - unit: new_brunswick
            - unit: prince_edward_island
            - unit: british_columbia
            - unit: newfoundland
            - unit: ruperts_land
            - unit: arctic_islands

  - date: 1870-07-15
    title: Manitoba and the North-West Territories
    note: >-
      Canada takes over Rupert's Land and the North-Western Territory from the Hudson's Bay
      Company. A small square around the Red River settlement becomes Manitoba.
    changes:
      - create: manitoba
        name: Manitoba
        status: province
        sovereign: Canada
        capital: Winnipeg
        confidence: 0.95
        instrument: Manitoba Act, 1870, 33 Vict. c. 3, s. 1 (assented 12 May 1870, in force 15 July 1870).
        rationale: >-
          Section 1 fixes the province on the 96° and 99° meridians and the 49° and 50°30' parallels, so the
          box is drawn on those lines; NRCan's box is drafted 2–3 km off them.
        nrcan_overlay:
          year: 1870
          polygons:
            - name: Manitoba
        boundary: >-
          The Manitoba Act: 49°N to 50°30'N between 96°W and 99°W. NRCan's box sits 2–3 km off
          these lines.
        geometry: {box: [-99.0, 48.5, -96.0, 50.5]}

      - create: northwest_territories
        name: North-West Territories
        status: territory
        sovereign: Canada
        capital: Fort Garry (Winnipeg)
        nrcan: Northwest Territories
        note: Governed from Manitoba by its Lieutenant-Governor.
        boundary: Rupert's Land and the North-Western Territory, less Manitoba.
        geometry:
          minus:
            - union: [{unit: ruperts_land}, {unit: north_western_territory}]
            - unit: manitoba

      - dissolve: ruperts_land
      - dissolve: north_western_territory

  - date: 1871-07-20
    title: British Columbia joins
    note: >-
      British Columbia enters Confederation on the promise of a railway to the Pacific. Its
      boundaries are unchanged.
    changes:
      - alter: british_columbia
        status: province
        sovereign: Canada

  - date: 1873-07-01
    title: Prince Edward Island joins
    note: >-
      Prince Edward Island joins Canada six years after Confederation. The island's boundaries are
      unchanged.
    changes:
      - alter: prince_edward_island
        status: province
        sovereign: Canada

  - date: 1874-07-09
    title: Ontario's provisional boundary
    date_confidence: 0.8
    note: >-
      Ontario and the Dominion agree on a provisional line while Ontario's true limits are argued.
      Ontario extends north to 51°N and west to the meridian of Hunter's Island. The arrangement took
      effect when Ontario's order approved it on 9 July 1874; the memorandum itself is dated 26 June and
      the Dominion's approving order 8 July.
    changes:
      - alter: ontario
        boundary: >-
          Memorandum of 26 June 1874, approved by Dominion order of 8 July and Ontario order of 9 July: west, the meridian through the most easterly point of
          Hunter's Island (90°58'W) from the international boundary to 51°N; north, 51°N east to
          the line due north of Lake Timiskaming (the modern Ontario–Quebec line).
        geometry:
          union:
            - unit: ontario
            - intersect: [{modern: [ON]}, {box: [-90.9667, 41.0, -74.0, 51.0]}]
      - alter: northwest_territories
        boundary: Less Ontario's provisional extension.
        geometry:
          minus: [{unit: northwest_territories}, {unit: ontario}]

  - date: 1876-10-07
    title: District of Keewatin
    note: >-
      The Keewatin Act carves a district from the North-West Territories between Manitoba and
      Hudson Bay. The Lieutenant-Governor of Manitoba governs it from Winnipeg.
    changes:
      - create: district_of_keewatin
        name: District of Keewatin
        status: district
        sovereign: Canada
        note: Governed from Winnipeg by the Lieutenant-Governor of Manitoba and the Council of Keewatin.
        boundary: >-
          The Keewatin Act: from Ontario's western limit (the 1874 meridian) west along the
          international boundary to Manitoba, north along 96°W to 50°30'N, west to Lake Manitoba,
          along its west shore, Meadow Portage, Lake Winnipegosis and Mossy Portage to Cedar Lake
          (NRCan waypoints), then due north (100°W, as NRCan draws the Mossy Portage meridian) to the
          Arctic coast, east along the coast (Boothia and Melville peninsulas included) and south
          along Hudson Bay's west shore to the 1874 meridian. Mainland only: the coast is the limit.
        geometry:
          intersect:
            - unit: northwest_territories
            - mainland: true
            - ring:
                - line: [[-90.9667, 48.0], [-97.0, 48.0], [-97.0, 50.3], [-98.6, 50.3], [-98.592, 50.481]]
                - line: [[-98.592, 50.481], [-98.642, 50.610], [-98.875, 50.883], [-98.856, 50.955],
                         [-98.956, 50.965], [-99.025, 51.127], [-98.994, 51.145], [-98.902, 51.062],
                         [-98.894, 51.010], [-98.844, 51.001], [-98.814, 51.079], [-98.886, 51.098],
                         [-98.895, 51.178], [-98.857, 51.236], [-98.946, 51.227], [-98.938, 51.180],
                         [-98.985, 51.190], [-99.075, 51.271], [-99.154, 51.523], [-99.241, 51.562],
                         [-99.296, 51.522], [-99.329, 51.613], [-99.464, 51.623], [-99.524, 51.578],
                         [-99.502, 51.499], [-99.545, 51.494], [-99.574, 51.611], [-99.627, 51.635],
                         [-99.672, 51.709], [-99.652, 51.794], [-99.674, 51.876], [-99.753, 51.828],
                         [-99.741, 51.735], [-99.837, 51.754], [-99.861, 51.915], [-99.764, 51.935],
                         [-99.784, 52.028], [-99.865, 52.055], [-99.874, 52.256], [-99.779, 52.319],
                         [-99.675, 52.532], [-99.750, 52.811], [-99.714, 52.907], [-99.752, 52.912],
                         [-99.807, 52.861], [-99.822, 52.890], [-99.769, 52.961], [-100.0, 53.010]]
                - meridian: [-100.0, 53.010, 75.0]
                - line: [[-100.0, 75.0], [-82.0, 75.0], [-82.0, 63.0], [-86.0, 58.0], [-90.9667, 57.3],
                         [-90.9667, 48.0]]
      - alter: northwest_territories
        capital: Fort Livingstone
        note: The seat moved from Fort Livingstone to Battleford in 1877–78.
        boundary: Less the District of Keewatin.
        geometry:
          minus: [{unit: northwest_territories}, {unit: district_of_keewatin}]

  - date: 1880-09-01
    title: The Arctic islands
    note: >-
      Britain transfers all its remaining North American possessions to Canada, except
      Newfoundland. The Arctic Archipelago joins the North-West Territories.
    changes:
      - alter: northwest_territories
        capital: Battleford
        boundary: With the Arctic Archipelago.
        geometry:
          union: [{unit: northwest_territories}, {unit: arctic_islands}]
      - dissolve: arctic_islands

  - date: 1881-07-01
    title: Manitoba enlarged
    date_confidence: 0.95
    note: >-
      Manitoba grows west, north and east. Ontario claims the eastern part too, and the dispute goes to
      the Privy Council. The Act came into force on 1 July 1881 by proclamation of 13 June; a date of 23
      December 1881 found in some secondary sources has no support in the Canada Gazette.
    changes:
      - alter: manitoba
        boundary: >-
          West, the road allowance between ranges 29 and 30 west of the Principal Meridian (the
          modern Manitoba–Saskatchewan border); north, the 12th base line (52.8422°N); east, as
          NRCan draws it, the meridian of the North-West Angle of Lake of the Woods (95°09'W,
          the modern Manitoba–Ontario border). Manitoba claimed east to 89°09'W. In force 1 July 1881 under s. 4
          of 44 Vict. c. 14 and the proclamation of 13 June 1881.
        geometry:
          intersect: [{modern: [MB]}, {box: [-103.0, 48.5, -95.1534, 52.8422]}]
      - create: ontario_manitoba_disputed_area
        name: Ontario–Manitoba disputed area
        status: disputed
        sovereign: Canada (Ontario and Manitoba)
        nrcan: Disputed area
        note: >-
          Claimed by Manitoba under the 1881 Act and by Ontario under the 1878 arbitration. The
          Privy Council found for Ontario in 1884; Parliament confirmed it in 1889.
        boundary: >-
          As NRCan draws it: between 95°09'W and Ontario's 1874 meridian, from the international
          boundary north to the 12th base line. The legal claims reached further (Manitoba to
          89°09'W, Ontario north to the Albany River); those are a Sitting C overlay.
        geometry:
          intersect: [{unit: district_of_keewatin}, {box: [-95.1534, 48.0, -90.9667, 52.8422]}]
      - alter: district_of_keewatin
        boundary: Less Manitoba's extension and the disputed area.
        geometry:
          minus: [{unit: district_of_keewatin}, {unit: manitoba}, {unit: ontario_manitoba_disputed_area}]
      - alter: northwest_territories
        boundary: Less Manitoba's extension.
        geometry:
          minus: [{unit: northwest_territories}, {unit: manitoba}]

  - date: 1882-05-08
    title: Provisional districts
    note: >-
      Four districts are laid out on the prairies for settlers and the post office. Regina is
      chosen as the territorial capital.
    changes:
      - create: district_of_assiniboia
        name: District of Assiniboia
        status: district
        sovereign: Canada
        boundary: >-
          Order in council of 8 May 1882: 49°N to the 9th correction line (51.9686°N), from Manitoba
          west to the road allowance between ranges 10 and 11 west of the 4th Meridian.
        geometry:
          intersect:
            - unit: northwest_territories
            - ring:
                - shape: range_10_11_w4_to_55n
                - line: [[-111.5324, 55.1116], [-111.5324, 55.2], [-99.0, 55.2], [-99.0, 48.5], [-111.3419, 48.5],
                         [-111.3419, 49.0]]
            - box: [-120.0, 48.5, -99.0, 51.9686]
      - create: district_of_saskatchewan
        name: District of Saskatchewan
        status: district
        sovereign: Canada
        boundary: >-
          North of Assiniboia and Manitoba to the 18th correction line (55.1116°N), east of the
          ranges 10/11 W4 line. The order ran east to Lake Winnipeg and the Nelson River, over
          statutory Keewatin; NRCan leaves that overlap in Keewatin until 1886, and so does this atlas.
        geometry:
          intersect:
            - unit: northwest_territories
            - ring:
                - shape: range_10_11_w4_to_55n
                - line: [[-111.5324, 55.1116], [-95.0, 55.1116], [-95.0, 48.5], [-111.3419, 48.5], [-111.3419, 49.0]]
            - box: [-120.0, 51.9686, -95.0, 55.1116]
      - create: district_of_alberta
        name: District of Alberta
        status: district
        sovereign: Canada
        boundary: >-
