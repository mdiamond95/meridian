  - date: 1898-06-13
    title: Yukon Territory and Quebec's first extension
    note: >-
      The Klondike gold rush makes Yukon a separate territory with its capital at Dawson. Quebec
      extends north to the Eastmain River and east to Hamilton Inlet.
    changes:
      - alter: yukon
        name: Yukon Territory
        nrcan: Yukon Territory
        status: territory
        capital: Dawson
        boundary: >-
          Yukon Territory Act: the 1895 district description (136°W version), which the Act adopted,
          with islands within three miles of the coast.
        geometry:
          intersect:
            - union: [{was: yukon}, {was: district_of_mackenzie}]
            - union: [{mainland: true}, {coastal_islands: 5.56}]
            - shape: yukon_1895
      - alter: district_of_mackenzie
        boundary: With the land between the 1897 and 1895 Yukon lines.
        geometry:
          minus:
            - union: [{was: district_of_mackenzie}, {was: yukon}]
            - unit: yukon
      - alter: quebec
        boundary: >-
          Quebec Boundary Extension Act, 1898: from Lake Timiskaming's meridian at James Bay up the
          Eastmain River (Canada1Water) to Patamisk Lake, due east along 52°55'N to the Hamilton
          (Ashuanipi) River, and down it through its lakes to Hamilton Inlet (NRCan waypoints), then
          Newfoundland's coast strip south to Blanc-Sablon.
        geometry:
          union:
            - was: quebec
            - intersect:
                - was: district_of_ungava
                - ring:
                    - river: {names: [Rivière Eastmain], region: hudson, from: [-78.52, 52.25], to: [-70.829, 52.516],
                              bridge_km: 10}
                    - line: [[-70.829, 52.516], [-70.816, 52.9167], [-67.10, 52.9167]]
                    - line: [[-67.10, 52.9167], [-66.808, 52.818], [-66.715, 52.788], [-66.704, 52.934],
                             [-66.482, 53.035], [-66.290, 52.998], [-66.315, 53.082], [-66.238, 53.260],
                             [-66.543, 53.688], [-66.502, 54.044], [-66.717, 54.424], [-66.469, 54.607],
                             [-66.242, 54.453], [-66.201, 54.350], [-65.924, 54.248], [-65.856, 54.132],
                             [-65.438, 53.894], [-64.973, 53.850], [-64.913, 53.751], [-64.477, 53.689],
                             [-64.221, 53.541], [-63.662, 53.425], [-63.275, 53.221], [-62.435, 53.139],
                             [-62.251, 53.056], [-62.200, 52.936], [-61.657, 52.874], [-61.630, 52.976],
                             [-61.410, 52.975], [-60.969, 53.181]]
                    - line: [[-60.969, 53.181], [-57.0, 53.0], [-57.0, 45.0], [-80.0, 45.0], [-80.0, 52.25], [-78.52, 52.25]]
      - alter: district_of_ungava
        boundary: Less Quebec's extension.
        geometry:
          minus: [{was: district_of_ungava}, {unit: quebec}]

  - date: 1901-05-23
    title: Yukon's boundary redrawn
    note: >-
      Parliament moves Yukon's eastern boundary onto the mountain divides. It is the line Yukon
      still has.
    changes:
      - alter: yukon
        boundary: >-
          The 1901 Act's watershed line, which is the modern Yukon–Northwest Territories border.
        geometry:
          intersect:
            - union: [{was: yukon}, {was: district_of_mackenzie}]
            - modern: [YT]
      - alter: district_of_mackenzie
        boundary: Less Yukon's new line.
        geometry:
          minus:
            - union: [{was: district_of_mackenzie}, {was: yukon}]
            - unit: yukon

  - date: 1903-10-20
    title: The Alaska boundary award
    note: >-
      An international tribunal settles the Alaska panhandle boundary, mostly in favour of the
      United States. The atlas draws the award line throughout, as NRCan does; the earlier claim
      lines arrive with the disputed layer.
    changes: []

  - date: 1905-09-01
    title: Alberta and Saskatchewan
    note: >-
      Two provinces are carved from the North-West Territories, each running from 49°N to 60°N.
      Keewatin is folded back into the territories, now run from Ottawa.
    changes:
      - create: alberta
        name: Alberta
        status: province
        sovereign: Canada
        capital: Edmonton
        boundary: >-
          Alberta Act: 49°N to 60°N between 110°W and British Columbia. Modern Alberta.
        geometry: {modern: [AB]}
      - create: saskatchewan
        name: Saskatchewan
        status: province
        sovereign: Canada
        capital: Regina
        boundary: >-
          Saskatchewan Act: 49°N to 60°N between 110°W and Manitoba's west boundary continued north to
          102°W. Modern Saskatchewan.
        geometry: {modern: [SK]}
      - alter: district_of_keewatin
        note: Re-annexed to the North-West Territories, which were governed from Ottawa.
        boundary: >-
          With the pieces of the old Saskatchewan and Athabaska districts left east of the new
          provinces, west to 102°W. No instrument assigned them before 1920; NRCan draws them in
          Keewatin, and so does this atlas.
        geometry:
          minus:
            - union:
                - was: district_of_keewatin
                - was: district_of_assiniboia
                - was: district_of_saskatchewan
                - was: district_of_alberta
                - was: district_of_athabasca
            - unit: alberta
            - unit: saskatchewan
      - dissolve: district_of_assiniboia
      - dissolve: district_of_saskatchewan
      - dissolve: district_of_alberta
      - dissolve: district_of_athabasca

  - date: 1912-05-15
    title: Manitoba, Ontario and Quebec extended
    note: >-
      Three provinces extend north to Hudson Bay and Hudson Strait, taking most of Keewatin and the
      mainland of Ungava. Manitoba reaches 60°N.
    changes:
      - alter: manitoba
        boundary: >-
          Manitoba Boundaries Extension Act, 1912: north to 60°N and Hudson Bay, east along 95°09'W
          to the 12th base line, then straight lines to the east end of Island Lake and to 89°W on
          Hudson Bay. The modern border; no islands.
        geometry: {modern: [MB]}
      - alter: ontario
        boundary: >-
          Ontario Boundaries Extension Act, 1912: from the Albany River north to Hudson Bay, west to
          Manitoba's new line. The modern border.
        geometry: {modern: [ON]}
      - alter: quebec
        boundary: >-
          Quebec Boundaries Extension Act, 1912: the mainland of Ungava north to Hudson Strait and
          east to Newfoundland's coast. Coastal islands stay in the territories.
        geometry:
          union:
            - was: quebec
            - intersect: [{was: district_of_ungava}, {mainland: true}]
      - alter: district_of_keewatin
        boundary: Less Manitoba's and Ontario's extensions.
        geometry:
          minus: [{was: district_of_keewatin}, {unit: manitoba}, {unit: ontario}]
      - alter: district_of_ungava
        confidence: 0.8
        instrument: >-
          Order in Council P.C. 1897-3388 (18 December 1897), description "UNGAVA" (bounded by the middle of
          Hudson Strait and Keewatin's mid-water line); Quebec Boundaries Extension Act, 1912, 2 Geo. V c. 45,
          s. 2 (the new boundary runs "along the shores"); Order in Council of 16 March 1918, cancelling the
          1897 order and in force 1 January 1920.
        rationale: >-
          The 1912 Act moved only the mainland to Quebec and the 1897 order defining Ungava stood until 1
          January 1920, so the islands remain a district until then; NRCan already splits them between
          Keewatin and Franklin, and the Act excludes islands only by following the shore, hence 0.8.
        nrcan_overlay:
          year: 1912
          polygons:
            - name: District of Keewatin
              clip: {unit: district_of_ungava}
              note: NRCan's 1912 map puts these Ungava islands in Keewatin.
            - name: District of Franklin
              clip: {unit: district_of_ungava}
              note: NRCan's 1912 map puts these Ungava islands in Franklin.
        boundary: >-
          The islands left of the district: the east side of Hudson and James Bays, the south half
          of Hudson Strait and Ungava Bay. The 1897 order was not cancelled until 1920; NRCan already
          splits these islands between Keewatin and Franklin as the 1918 order would.
        geometry:
          minus: [{was: district_of_ungava}, {unit: quebec}]

  - date: 1920-01-01
    title: Northwest Territories districts revised
    note: >-
      An order of 1918 comes into force, leaving three districts: Mackenzie, Keewatin and Franklin.
      The District of Ungava disappears.
    changes:
      - alter: district_of_mackenzie
        boundary: >-
          Order in council of 16 March 1918: west, Yukon; south, 60°N; east, the 2nd Meridian (102°W);
          north, the continental Arctic shore. Mainland only.
        geometry:
          intersect:
            - shape: northern_pool
            - mainland: true
            - box: [-141.5, 59.9, -102.0, 76.0]
      - alter: district_of_keewatin
        boundary: >-
          From 102°W east along the Arctic shore to Spence Bay, across Boothia Isthmus to Lord Mayor
          Bay, along the Gulf of Boothia to its southern end, across Rae Isthmus to Repulse Bay,
          through Repulse Bay and Frozen Strait to Foxe Channel, then straight to Cape Wolstenholme;
          all islands in Hudson and James Bays south-west of that line; south to Manitoba and 60°N.
        geometry:
          union:
            - minus:
                - intersect: [{shape: northern_pool}, {mainland: true}, {box: [-102.0, 55.0, -60.0, 80.0]}]
                - shape: boothia_peninsula
                - shape: melville_peninsula
            - minus:
                - intersect:
                    - shape: northern_pool
                    - zone:
                        ring:
                          - line: [[-77.5, 62.58], [-81.0, 64.9], [-84.3, 65.9], [-85.5, 66.3], [-86.3, 66.5], [-95.0, 66.5]]
                          - line: [[-95.0, 66.5], [-95.0, 50.0], [-76.0, 50.0], [-76.0, 62.58], [-77.5, 62.58]]
                - mainland: true
      - alter: district_of_franklin
        boundary: >-
          The rest: the Arctic islands, the Boothia and Melville peninsulas, and the islands of Hudson
          Strait and Ungava Bay, Nottingham and Salisbury included. NRCan's maps from 1927 put
          Nottingham in Keewatin, contrary to the order.
        geometry:
          minus:
            - shape: northern_pool
            - unit: district_of_mackenzie
            - unit: district_of_keewatin
      - dissolve: district_of_ungava

  - date: 1927-03-01
    title: The Labrador boundary
    date_confidence: 0.9
    note: >-
      The Judicial Committee of the Privy Council sets the boundary between Canada and Newfoundland in
      Labrador, and Newfoundland gets the whole Atlantic watershed. The report was delivered on 1 March
      1927; His Majesty in Council approved it on 22 March 1927.
    changes:
      - alter: newfoundland
        note: >-
          A Dominion under a Commission of Government from 1934. The Privy Council's line of 1927 has
          never been demarcated, and Quebec has not formally accepted it.
        boundary: >-
          Privy Council report of 1 March 1927: due north from Blanc-Sablon to 52°N, west to the
          Romaine River, up it to its source, and along the crest of the Atlantic watershed to Cape
          Chidley. The modern border.
        geometry: {modern: [NL]}
      - alter: quebec
        boundary: Less Labrador as the Privy Council drew it. Modern Quebec.
        geometry: {modern: [QC]}
      - alter: district_of_franklin
        confidence: 0.9
        instrument: >-
          Order in Council of 16 March 1918 (in force 1 January 1920), description of Keewatin: "thence
          southeasterly in a straight line to the most northerly point of cape Wolstenholme"; Franklin is the
          remainder of the Northwest Territories.
        rationale: >-
          Nottingham Island lies at least 8 km north-east of the Frozen Strait–Cape Wolstenholme line, so it
          stays in Franklin; NRCan's maps from 1927 draw it in Keewatin.
        nrcan_overlay:
          year: 1927
          polygons:
            - name: District of Keewatin
              clip: {island: [-77.9, 63.3]}
              note: NRCan's maps from 1927 put Nottingham Island in Keewatin.
        boundary: >-
          Less a few coastal islets that modern Quebec (Atlas of Canada 1:1M) includes. No instrument
          moved them; NRCan's 1927 Franklin shrinks by a similar area. Nottingham Island stays in
          Franklin.
        geometry:
          minus: [{was: district_of_franklin}, {unit: quebec}]

  - date: 1949-03-31
    title: Newfoundland joins
    note: >-
      Newfoundland becomes Canada's tenth province after two referendums. Its boundaries, Labrador
      included, are those of 1927.
    changes:
      - alter: newfoundland
        status: province
        sovereign: Canada

  - date: 1953-04-01
    title: Whitehorse becomes Yukon's capital
    note: >-
      Yukon's capital moves from Dawson to Whitehorse, on the highway and the railway. No boundary
      changes.
    changes:
      - alter: yukon
        capital: Whitehorse

  - date: 1999-04-01
    title: Nunavut
    note: >-
      Nunavut is created from the eastern and northern Northwest Territories, following the
      Nunavut Land Claims Agreement. The old districts of Mackenzie, Keewatin and Franklin end.
    changes:
      - create: nunavut
        name: Nunavut
        status: territory
        sovereign: Canada
        capital: Iqaluit
        boundary: >-
          Nunavut Act, 1993: north of 60°N and east of the Schedule I line, with all the islands of
          Hudson, James and Ungava Bays not in a province. The modern border.
        geometry: {modern: [NU]}
      - create: northwest_territories
        name: Northwest Territories
        status: territory
        sovereign: Canada
        capital: Yellowknife
        boundary: The rest of the territories west of the Schedule I line. The modern border.
        geometry: {modern: [NT]}
      - dissolve: district_of_mackenzie
      - dissolve: district_of_keewatin
      - dissolve: district_of_franklin

  - date: 2001-12-06
    title: Newfoundland and Labrador
    note: >-
      A constitutional amendment renames the province Newfoundland and Labrador. Its boundaries are
      unchanged.
    changes:
      - rename: newfoundland
        name: Newfoundland and Labrador

  - date: 2003-04-01
    title: Yukon
    note: >-
      The new Yukon Act drops "Territory" from the name. Its boundaries are unchanged.
    changes:
      - rename: yukon
        name: Yukon
