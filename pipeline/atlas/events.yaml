          United States' line published at 60 Fed. Reg. 43825 (12 points). The two lines share their end points.
        rationale: >-
          Both states publish a line, the lines differ, and neither has moved: the ground between them is the
          dispute, and it is the only one in this atlas that is still open.
        note: >-
