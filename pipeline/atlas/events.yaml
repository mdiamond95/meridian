  - date: 1895-10-02
    title: Districts of the North
    note: >-
      An order in council divides the northern territories into the districts of Ungava, Franklin,
      Mackenzie and Yukon. Athabaska grows east to 100°W.
    changes:
      - create: yukon
        name: District of Yukon
        status: district
        sovereign: Canada
        boundary: >-
          Order in council 2640 of 1895: 141°W from the Arctic coast to the Alaska boundary, 60°N to
          the Liard River, then the mountain ranges west of the Liard and the Peel to 136°W and due
          north to the Arctic (NRCan waypoints), with islands within three miles of the coast.
        geometry:
          intersect:
            - unit: northwest_territories
            - union: [{mainland: true}, {coastal_islands: 5.56}]
            - shape: yukon_1895
      - create: district_of_mackenzie
        name: District of Mackenzie
        status: district
        sovereign: Canada
        boundary: >-
          From the District of Yukon east to 100°W, between 60°N (the 32nd correction line east of
          120°W) and the Arctic coast, with islands within three miles of the coast.
        geometry:
          minus:
            - intersect:
                - unit: northwest_territories
                - union: [{mainland: true}, {coastal_islands: 5.56}]
                - box: [-141.5, 60.0, -100.0, 76.0]
            - unit: yukon
      - create: district_of_franklin
        name: District of Franklin
        status: district
        sovereign: Canada
        boundary: >-
          The islands north of Hudson Strait, Foxe Channel, the Gulf of Boothia and the straits west
          to Amundsen Gulf, and west to Banks and Prince Patrick. The Boothia and Melville peninsulas
          stay in Keewatin under the Keewatin Act.
        geometry:
          intersect: [{unit: northwest_territories}, {shape: arctic_islands}]
      - create: district_of_ungava
        name: District of Ungava
        status: district
        sovereign: Canada
        boundary: >-
          North of Quebec to Hudson Strait, east of Hudson and James Bays to Newfoundland's coast, with
          islands within three miles of the coast. NRCan also gives Ungava the far islands of Hudson
          Bay (Southampton, Coats, Mansel, Belcher); the order did not, and they stay outside any
          district here until 1897.
        geometry:
          intersect:
            - unit: northwest_territories
            - union: [{mainland: true}, {coastal_islands: 5.56}]
            - box: [-80.5, 45.0, -55.0, 63.0]
      - alter: district_of_athabasca
        boundary: Extended east to 100°W between the 18th correction line and 60°N.
        geometry:
          union:
            - unit: district_of_athabasca
            - intersect: [{unit: northwest_territories}, {box: [-113.0, 55.1116, -100.0, 60.0]}]
      - alter: northwest_territories
        confidence: 0.85
        instrument: >-
          Order in Council P.C. 1895-2640 (2 October 1895, Canada Gazette 19 October 1895, p. 684), Keewatin
          paragraph: the Minister "recommends that at the next Session of Parliament a Bill be introduced"
          to add about 470,000 square miles to Keewatin; the Ungava paragraph includes only islands "within a
          distance of three sea miles from the coast". Keewatin's limits were fixed by the Keewatin Act, 39
          Vict. c. 21, s. 1 (R.S.C. 1886, c. 53).
        rationale: >-
          The 1895 order drew the four new districts directly but only proposed a bill to enlarge statutory
          Keewatin, and no bill was introduced (recited in P.C. 1897-3388), so this land stays outside any
          district until the 1897 order; NRCan draws the enlargement as if it had taken effect.
        nrcan_overlay:
          year: 1895
          polygons:
            - name: District of Keewatin
              note: NRCan draws Keewatin with the enlargement the 1895 order only proposed.
            - name: District of Ungava
              clip: {unit: northwest_territories}
              note: NRCan also puts the far islands of Hudson Bay in Ungava, beyond the order's three sea miles.
        boundary: >-
          The land in no district: north of Ontario east of statutory Keewatin, and the far islands
          of Hudson Bay and Hudson Strait. The order proposed adding the first to Keewatin by bill;
          no bill was introduced. NRCan draws both inside Keewatin and Ungava, so NRCan has no
          polygon here.
        geometry:
          minus:
            - unit: northwest_territories
            - unit: yukon
            - unit: district_of_mackenzie
            - unit: district_of_franklin
            - unit: district_of_ungava
            - unit: district_of_athabasca

  - date: 1897-12-18
    title: Districts redrawn
    note: >-
      A new order in council redraws the northern districts along the middle of the bays and
      straits. Keewatin takes Hudson Bay's western islands, and Franklin takes the Boothia and
      Melville peninsulas.
    changes:
      - alter: district_of_keewatin
        boundary: >-
          Order in council 3388 of 1897 (provisional district): from the Ontario–Quebec line north
          through the middle of James Bay (Akimiski and Bear islands west, Charlton and the Twin
          Islands east), through Hudson Bay between Coats and Mansel, Foxe Channel, Frozen Strait and
          Repulse Bay, across Rae Isthmus, through Committee Bay and the Gulf of Boothia, across
          Boothia Isthmus to Spence Bay and the waters south of King William Island to 100°W; south
          along 100°W to the 18th correction line, east to the Nelson River, and down the Nelson and
          Lake Winnipeg to Manitoba and Ontario. Statutory Keewatin still existed inside it.
        instrument: >-
          Order in Council P.C. 1897-3388 (18 December 1897, Canada Gazette 14 May 1898, pp. 2613–2614),
          annexed description "KEEWATIN"; cancelled from 1 January 1920 by the order of 16 March 1918.
        note: >-
          A provisional district created by order, alongside the statutory District of Keewatin of 1876. Unlike
          the 1895 proposal, the 1897 order annexed a full description of the district, the Minister of Justice
          advised in 1898 that provisional districts needed no statute, and the 1918 order recites it as having
          defined "the provisional district of Keewatin". Statutory Keewatin rejoined the territories in 1905.
        geometry:
          union:
            # Mainland: west of the line through James Bay and Hudson Bay, less the two peninsulas.
            - minus:
                - intersect:
                    - shape: northern_pool_with_yukon
                    - mainland: true
                    - ring:
                        - line: [[-100.0, 45.0], [-100.0, 76.0], [-84.0, 76.0], [-80.0, 70.0], [-79.5, 65.0], [-79.2, 63.7],
                                 [-80.2, 63.0], [-81.0, 62.4], [-81.0, 54.9], [-80.6, 54.4], [-80.5, 53.2], [-79.8, 52.0],
                                 [-79.52, 51.47]]
                        - line: [[-79.52, 51.47], [-79.52, 45.0], [-100.0, 45.0]]
                - shape: boothia_peninsula
                - shape: melville_peninsula
            # Islands: those on Keewatin's side of the middle of the bays and straits.
            - minus:
                - intersect:
                    - shape: northern_pool_with_yukon
                    - zone:
                        ring:
                          - line: [[-100.0, 68.2], [-97.3, 68.55], [-95.5, 68.8], [-93.6, 69.45], [-92.1, 69.6], [-89.3, 69.7],
                                   [-87.5, 68.6], [-87.35, 67.45], [-86.3, 66.5], [-85.5, 66.3], [-84.5, 65.95], [-81.5, 65.3],
                                   [-79.5, 65.0], [-79.2, 63.7], [-80.2, 63.0], [-81.0, 62.4], [-81.0, 54.9], [-80.6, 54.4],
                                   [-80.5, 53.2], [-79.8, 52.0], [-79.52, 51.47]]
                          - line: [[-79.52, 51.47], [-79.52, 45.0], [-100.0, 45.0], [-100.0, 68.2]]
                - mainland: true
      - alter: district_of_ungava
        boundary: >-
