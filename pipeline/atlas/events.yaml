      extends north to the Eastmain River and east to Hamilton Inlet.
    changes:
      - alter: yukon
        name: Yukon Territory
        nrcan: Yukon Territory
        status: territory
        capital: Dawson
        boundary: >-
          Yukon Territory Act: the 1895 district description (136°W version), which the Act adopted,
          with islands within three miles of the coast.
        geometry:
          intersect:
            - union: [{was: yukon}, {was: district_of_mackenzie}]
            - union: [{mainland: true}, {coastal_islands: 5.56}]
            - shape: yukon_1895
      - alter: district_of_mackenzie
        boundary: With the land between the 1897 and 1895 Yukon lines.
        geometry:
          minus:
            - union: [{was: district_of_mackenzie}, {was: yukon}]
            - unit: yukon
      - alter: quebec
        boundary: >-
          Quebec Boundary Extension Act, 1898: from Lake Timiskaming's meridian at James Bay up the
          Eastmain River (Canada1Water) to Patamisk Lake, due east along 52°55'N to the Hamilton
          (Ashuanipi) River, and down it through its lakes to Hamilton Inlet (NRCan waypoints), then
          Newfoundland's coast strip south to Blanc-Sablon.
        geometry:
          union:
            - was: quebec
            - intersect:
                - was: district_of_ungava
                - ring:
                    - river: {names: [Rivière Eastmain], region: hudson, from: [-78.52, 52.25], to: [-70.829, 52.516],
                              bridge_km: 10}
                    - line: [[-70.829, 52.516], [-70.816, 52.9167], [-67.10, 52.9167]]
