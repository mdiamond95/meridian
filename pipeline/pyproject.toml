[project]
name = "meridian-pipeline"
version = "0.0.0"
description = "Offline data pipeline for Meridian: base mesh, attributes, atlas, layers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2",
  "h3>=4",
  "pyogrio",
  "pyyaml",
  "requests",
  "numpy",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
