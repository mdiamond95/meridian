# The artefact plan: every file the pipeline writes to data/build/, what it is built from,
# and which contract it conforms to. `make dry-run` validates this file and prints the plan.
#
# Rules (docs/plan.md, running rules):
#   - outputs live under data/build/ and carry their version in the filename (.v<N>.)
#   - every output names the JSON Schema it must pass (exported from app/src/schema);
#     `make validate` and pytest check each file in data/build/ against it
#   - inputs are source ids from the table in docs/data-sources.md

plan_version: 1

# Native Land Digital is declined permanently (docs/decisions.md, 2026-09-16). This is a record, not a
# gate: no code path fetches or loads their data, and `make dry-run` fails on any other value so the
# decision cannot be reopened by editing one word. The pre-contact base uses the in-house
# language-family layer (indigenous.v1) instead.
permissions:
  native_land_permission: declined

# Sources fetched by a route other than their official URL. The official URL is authoritative;
# the route is how this repository obtains the identical file (see pipeline/README.md).
source_routes:
  statcan_gdp_36100711:
    official_url: https://www150.statcan.gc.ca/n1/tbl/csv/36100711-eng.zip
    route: github-actions .github/workflows/fetch-gdp.yml → artifact statcan-gdp-36100711

artefacts:
  - id: mesh
    phase: 1
    step: pipeline/mesh.py
    description: H3 res-5 cells over Canada (land + inland water) with province/CD/CSD and neighbour graph
    inputs: [nrcan_atlas_boundaries_1m, statcan_csd_2021]
    outputs:
      - { path: data/build/mesh.v1.json.gz, schema: docs/schemas/mesh.schema.json }

  - id: attrs
    phase: 1
    step: pipeline/attributes.py
    description: Per-cell attribute columns (population, language, industry, GDP allocation, treaties, Indigenous language family, ...)
    inputs:
      - statcan_csd_2021
      - statcan_da_2021
      - statcan_cma_2021
      - statcan_profile_da_2021
      - statcan_profile_csd_2021
      - statcan_gdp_36100711
      - cirnac_historic_treaties
      - cirnac_modern_treaties
      - nrcan_aboriginal_lands
      - ab_metis_settlements
      - cirnac_inuit_regions
      - aafc_ecozones
      - statcan_drainage_regions
      - nrcan_nhn_workunits
      - elections_fed_2023
      - elections_results_ge45
      - statcan_profile_csd_indigenous_languages_2021
      - glottolog_languoids
      - wikidata_indigenous_communities
    outputs:
      - { path: data/build/attrs.v1.json.gz, schema: docs/schemas/attrs.schema.json }

  - id: layers
    phase: 1
    step: pipeline/polygons.py
    description: Simplified TopoJSON overlay and snap layers (mapshaper; provinces/CD/CSD share one topology per zoom tier)
    inputs:
      - statcan_csd_2021
      - cirnac_historic_treaties
      - cirnac_modern_treaties
      - aafc_ecozones
      - statcan_drainage_regions
      - nrcan_nhn_workunits
      - nrcan_c1w_strahler_arctic
      - nrcan_c1w_strahler_atlantic
      - nrcan_c1w_strahler_baffin
      - nrcan_c1w_strahler_hudson
      - nrcan_c1w_strahler_islands
      - nrcan_c1w_strahler_mackenzie
      - nrcan_c1w_strahler_nelson
      - nrcan_c1w_strahler_pacific
      - elections_fed_2023
      - glottolog_languoids
      - wikidata_indigenous_communities
    outputs:
      - { path: data/build/layers/boundaries.low.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      - { path: data/build/layers/boundaries.mid.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      - { path: data/build/layers/boundaries.high.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      - { path: data/build/layers/treaties.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      - { path: data/build/layers/ecozones.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      - { path: data/build/layers/basins.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      - { path: data/build/layers/rivers.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      - { path: data/build/layers/ridings.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      # The pre-contact base's language families (dissolved from the attrs column) and community
      # labels. Its own pair, like the contact frontier, fetched only when the layer is asked for.
      - { path: data/build/indigenous.v1.json, schema: docs/schemas/indigenous.schema.json }
      - { path: data/build/indigenous.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }

  - id: atlas
    phase: 2
    step: pipeline/atlas/build.py
    description: Historical event list resolved to first-order unit polygons
    inputs:
      - nrcan_atlas_boundaries_1m
      - statcan_drainage_regions
      - nrcan_c1w_strahler_hudson
      - nrcan_c1w_strahler_mackenzie
      - nrcan_c1w_strahler_nelson
      # NRCan's drawing, shipped only as reference overlays where the atlas departs from it.
      - nrcan_te_1867
      - nrcan_te_1870
      - nrcan_te_1895
      - nrcan_te_1912
      - nrcan_te_1927
    outputs:
      - { path: data/build/atlas.v1.json, schema: docs/schemas/atlas.schema.json }
      - { path: data/build/atlas.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
      # The contact frontier, from pipeline/atlas/contact.yaml. Its own pair of files: a band's
      # edge is not a boundary and must never be snapped to one.
      - { path: data/build/contact.v1.json, schema: docs/schemas/contact.schema.json }
      - { path: data/build/contact.v1.topojson.gz, schema: docs/schemas/topojson.schema.json }
