name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public CARTO basemaps key from the repository variable (not a secret: it ships in the bundle).
      # Used by the build and by the smoke test, which asserts the deployed bundle uses CARTO.
      CARTO_BASEMAPS_KEY: ${{ vars.CARTO_BASEMAPS_KEY }}
    steps:
      - name: Pages keeps CARTO — require the basemap key
        run: |
          if [ -z "${CARTO_BASEMAPS_KEY// /}" ]; then
            echo "::error::Repository variable CARTO_BASEMAPS_KEY is not set; Pages must build with CARTO Positron."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx -w app playwright install --with-deps chromium
      - name: Smoke the exact bundle being deployed
        run: npm run smoke
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
