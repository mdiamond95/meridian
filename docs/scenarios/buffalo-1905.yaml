# A counterfactual branch of the atlas (plan Phase 6; docs/decisions.md, 2026-09-24 — Phase 6).
# Compiled by `npm run scenarios -w app` into app/src/scenario/scenarios.json; schema in
# docs/schemas/scenario.schema.json. Events here are merged into the base event list, after the
# base's own events on the same date; base events whose `requires` this breaks are skipped with a notice.
format: meridian.scenario
id: buffalo-1905
name: Unified Buffalo
fork: 1905-09-01
premise: >-
  From 1901 the premier of the North-West Territories, Frederick Haultain, asked Ottawa for one
  province between Manitoba and British Columbia, and suggested it be called Buffalo. Laurier's
  government made two instead, Alberta and Saskatchewan, on 1 September 1905. This scenario grants
  Haultain's request on that day. It keeps the outer boundary the two Acts drew, 49°N to 60°N from
  British Columbia to Manitoba's line continued north, and removes only the line between them at
  110°W, so it draws nothing the base atlas does not. The capital is Regina, the seat of the
  territorial government since 1883. Everything else happens as it did: Keewatin is folded back into
  the territories the same day, and the 1912 extensions and every later event apply unchanged.
events:
  - date: 1905-09-01
    title: The Province of Buffalo
    note: >-
      One prairie province is made from the North-West Territories in place of two, from 49°N to 60°N
      and from British Columbia to Manitoba's line continued north. Its capital is Regina.
    sources:
      - >-
        F. W. G. Haultain's case for a single province, put to Ottawa by the territorial government
        from 1901 (C. C. Lingard, Territorial Government in Canada: The Autonomy Question in the Old
        North-West Territories, University of Toronto Press, 1946).
      - >-
        Alberta Act, S.C. 1905, c. 3, and Saskatchewan Act, S.C. 1905, c. 42, in force 1 September
        1905: the outer boundaries kept here, and the 110°W line removed.
    changes:
      - dissolve: alberta
      - dissolve: saskatchewan
      - create: buffalo
        name: Buffalo
        status: province
        sovereign: Canada
        capital: Regina
        geometry:
          union:
            - {unit: alberta, at: 1905-09-01}
            - {unit: saskatchewan, at: 1905-09-01}
        instrument: >-
          Haultain's single-province proposal (1901–1905), in place of the Alberta Act and the
          Saskatchewan Act of 1905.
        note: >-
          Counterfactual: Alberta and Saskatchewan as one province, without the fourth meridian between
          them.
